<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de QR — bioquimica.cl</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='flor-bq.svg') }}">
  <style>
    * { box-sizing: border-box; }
    :root {
      --cyan: #29ABE2;
      --orange: #F7941D;
      --yellow: #FFD400;
      --red: #ED1C24;
      --ink: #111111;
    }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #ffffff;
      color: var(--ink);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      border: 1px solid #e5e5e5;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    .logo {
      display: block;
      width: 100%;
      max-width: 260px;
      margin: 0 auto 24px;
    }
    h1 {
      font-size: 1.2rem;
      margin: 0 0 20px;
      text-align: center;
      color: var(--ink);
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input[type="url"], input[type="text"] {
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #d4d4d4;
      background: #ffffff;
      color: var(--ink);
      font-size: 1rem;
    }
    input[type="url"]:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(41, 171, 226, 0.2);
    }
    button {
      padding: 12px 14px;
      border-radius: 8px;
      border: none;
      background: var(--orange);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #e07f00; }
    .error {
      color: var(--red);
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .resultado {
      margin-top: 24px;
      text-align: center;
    }
    .resultado img {
      width: 100%;
      max-width: 260px;
      background: white;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #e5e5e5;
    }
    .download-form {
      margin-top: 16px;
    }
    .download-btn {
      background: var(--cyan);
    }
    .download-btn:hover { background: #1c8fc4; }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin: 0 2px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="{{ url_for('static', filename='logo_bioquimica.png') }}" alt="bioquimica.cl">
    <h1>Generador de código QR</h1>
    <form method="POST" action="/">
      <input type="url" name="url" placeholder="https://ejemplo.com" value="{{ url }}" required>
      <button type="submit">Generar QR</button>
    </form>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    {% if qr_base64 %}
      <div class="resultado">
        <img src="data:image/png;base64,{{ qr_base64 }}" alt="Código QR generado">
        <form class="download-form" method="POST" action="/download">
          <input type="hidden" name="url" value="{{ url }}">
          <button type="submit" class="download-btn">Descargar QR</button>
        </form>
      </div>
    {% endif %}
  </div>
</body>
</html>
